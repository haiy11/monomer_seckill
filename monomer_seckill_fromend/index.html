<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秒杀 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f6f8;
      color: #333;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .toolbar input {
      width: 160px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { color: #888; font-weight: 500; }
    .stock { color: #e74c3c; font-weight: 600; }
    button {
      padding: 7px 16px;
      border: none;
      border-radius: 6px;
      background: #e74c3c;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #c0392b; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    #msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    #msg.ok { background: #e8f8ef; color: #27ae60; display: block; }
    #msg.err { background: #fdecea; color: #e74c3c; display: block; }
  </style>
</head>
<body>
  <h1>秒杀 Demo</h1>
  <div class="sub">单体秒杀 · 最简版本（MySQL + MyBatis-Plus，Redis 预留）</div>

  <div class="toolbar">
    <label>用户ID：</label>
    <input id="userId" type="number" value="1001" />
    <button id="refreshBtn" style="background:#555;">刷新商品</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>商品ID</th>
          <th>名称</th>
          <th>描述</th>
          <th>价格</th>
          <th>剩余库存</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="goodsBody">
        <tr><td colspan="6" style="text-align:center;color:#999;">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="msg"></div>

  <script>
    const API = 'http://localhost:8080';

    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = ok ? 'ok' : 'err';
    }

    async function loadGoods() {
      const body = document.getElementById('goodsBody');
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">加载中...</td></tr>';
      try {
        const res = await fetch(API + '/api/goods');
        const result = await res.json();
        if (result.code !== 200) {
          body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#e74c3c;">' + result.msg + '</td></tr>';
          return;
        }
        const list = result.data || [];
        if (list.length === 0) {
          body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无商品</td></tr>';
          return;
        }
        body.innerHTML = list.map(g => `
          <tr>
            <td>${g.id}</td>
            <td>${g.name}</td>
            <td>${g.description || ''}</td>
            <td>￥${g.price}</td>
            <td class="stock">${g.stock}</td>
            <td><button data-id="${g.id}" ${g.stock <= 0 ? 'disabled' : ''}>立即抢购</button></td>
          </tr>
        `).join('');
      } catch (e) {
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#e74c3c;">请求失败，请确认后端已启动</td></tr>';
        showMsg('无法连接后端 ' + API + '（请先启动 Spring Boot）', false);
      }
    }

    async function seckill(goodsId) {
      const userId = document.getElementById('userId').value;
      if (!userId) {
        showMsg('请先填写用户ID', false);
        return;
      }
      try {
        const res = await fetch(API + '/api/seckill/' + goodsId + '?userId=' + userId, { method: 'POST' });
        const result = await res.json();
        if (result.code === 200) {
          showMsg('抢购成功！订单ID：' + result.data, true);
        } else {
          showMsg('抢购失败：' + result.msg, false);
        }
        loadGoods();
      } catch (e) {
        showMsg('请求异常：' + e.message, false);
      }
    }

    document.getElementById('goodsBody').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (btn) seckill(btn.dataset.id);
    });
    document.getElementById('refreshBtn').addEventListener('click', loadGoods);

    loadGoods();
  </script>
</body>
</html>
