# seckill-service 基础配置（所有环境共享，dev/prod 可各自覆盖）。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/monomer_seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456hy
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: "admin123"
    virtual-host: /
    # 发布确认（correlated）：保证「Redis 预扣后发消息」不丢，消息投递失败可感知
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # AUTO：监听器正常返回即 ack，抛异常则 reject（默认 requeue 重新投递）
        acknowledge-mode: auto
        # 削峰核心：消费者并发 + 预取数，把瞬时高并发「削」成受控的 DB 写入速率
        concurrency: 4
        max-concurrency: 16
        prefetch: 50
  sql:
    init:
      # 建表由 goods-order-service 负责，本服务读写 seckill_goods/seckill_order，不执行 DDL
      mode: never
  cloud:
    sentinel:
      # 立即初始化 Sentinel：确保启动即加载规则、控制台可连（否则首请求才懒加载）
      eager: true
      transport:
        # Sentinel Dashboard 地址（可选）：可视化监控/动态改规则，需另行启动 sentinel-dashboard
        dashboard: localhost:8858
        # 本机上报/接收控制台指令的端口（同机多服务需互不相同，避免端口冲突）
        port: 8720

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 秒杀业务配置（P8：订单超时分钟数，用于延迟队列消息 TTL）
seckill:
  order-timeout-minutes: 15

# Sentinel 秒杀服务规则阈值（@RefreshScope 绑定，修改后不重启生效）
sentinel:
  seckill:
    degrade-rt-ms: 200
    slow-ratio-threshold: 0.2
    time-window-seconds: 10
    min-request-amount: 5
    stat-interval-ms: 1000
    param-flow-default-qps: 10
    param-flow-hot-qps: 5
    param-flow-hot-goods-id: 1
