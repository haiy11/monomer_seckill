server:
  port: 7003

spring:
  application:
    name: seckill-service
  config:
    import:
      # P7：配置集中到 Nacos Config。数据源/Redis/MyBatis/秒杀业务/Sentinel 规则等已迁到 Nacos。
      # 1) 共享配置（jwt.secret 等所有服务一致）；2) 本服务配置；3) 环境配置（dev 默认，可 --spring.profiles.active=prod 切换）
      - optional:nacos:seckill-common.yml
      - optional:nacos:seckill-service.yml
      - optional:nacos:seckill-service-${spring.profiles.active:dev}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        group: DEFAULT_GROUP
