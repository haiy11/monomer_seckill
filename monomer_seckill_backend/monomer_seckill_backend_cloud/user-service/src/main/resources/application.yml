server:
  port: 7001

spring:
  application:
    name: user-service
  config:
    import:
      # P7：配置集中到 Nacos Config。数据源/Redis/MyBatis 等已迁到 Nacos。
      - optional:nacos:seckill-common.yml
      - optional:nacos:user-service.yml
      - optional:nacos:user-service-${spring.profiles.active:dev}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        group: DEFAULT_GROUP
