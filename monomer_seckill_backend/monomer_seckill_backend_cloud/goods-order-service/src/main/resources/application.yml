server:
  port: 7002

spring:
  application:
    name: goods-order-service
  config:
    import:
      # P7：配置集中到 Nacos Config。数据源/Redis/MyBatis/sql.init 等已迁到 Nacos。
      - optional:nacos:seckill-common.yml
      - optional:nacos:goods-order-service.yml
      - optional:nacos:goods-order-service-${spring.profiles.active:dev}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        group: DEFAULT_GROUP
