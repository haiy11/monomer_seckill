server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      # P7：配置集中到 Nacos Config。网关路由/跨域/Sentinel 流控阈值等已迁到 Nacos。
      - optional:nacos:seckill-common.yml
      - optional:nacos:gateway-service.yml
      - optional:nacos:gateway-service-${spring.profiles.active:dev}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml
        group: DEFAULT_GROUP
