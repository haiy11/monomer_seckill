server:
  port: 7099

spring:
  application:
    name: monomer-seckill-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次启动自动创建 monomer_seckill 数据库
    url: jdbc:mysql://localhost:3307/monomer_seckill?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456hy
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  sql:
    init:
      # 每次启动自动执行 schema.sql / data.sql（幂等 SQL）
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL 日志，方便学习观察执行过程
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 秒杀业务配置
seckill:
  # 订单超时时间（分钟），超过未支付自动关闭并回补库存
  order-timeout-minutes: 15
  # 超时订单扫描间隔（毫秒）
  order-timeout-scan-ms: 30000

logging:
  level:
    org.example.monomer_seckill_backend: debug
